<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG image template</title>
<!-- Source for images/og-image.png (1200×630 link-preview image).
     Re-render after edits:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1200,630 --screenshot=images/og-image.png og-template.html -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
    background: #0b1120; color: #e2e8f0; position: relative;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(110px); opacity: .45; }
  .g1 { width: 520px; height: 520px; background: #4f46e5; top: -180px; left: -140px; }
  .g2 { width: 460px; height: 460px; background: #06b6d4; bottom: -200px; right: -120px; opacity: .35; }
  .grid {
    position: absolute; inset: 0; opacity: .07;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .wrap { position: relative; height: 100%; display: flex; align-items: center; gap: 64px; padding: 0 80px; }
  .text { flex: 1; }
  .logo {
    display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 18px;
    background: linear-gradient(135deg, #818cf8, #22d3ee); color: #fff; font-weight: 800; font-size: 26px;
    box-shadow: 0 10px 30px rgba(79, 70, 229, .45);
  }
  h1 { font-size: 64px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin-top: 30px; }
  .grad { background: linear-gradient(90deg, #818cf8, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .title { font-size: 30px; font-weight: 700; color: #c7d2fe; margin-top: 14px; }
  .stack { font-family: "JetBrains Mono", monospace; font-size: 21px; color: #94a3b8; margin-top: 18px; }
  .pills { display: flex; gap: 14px; margin-top: 34px; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px;
    font-size: 19px; font-weight: 600; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; }
  .photo-ring {
    flex-shrink: 0; width: 340px; height: 340px; border-radius: 50%; padding: 8px;
    background: conic-gradient(#818cf8, #22d3ee, #818cf8);
    box-shadow: 0 0 60px rgba(99, 102, 241, .45);
  }
  .photo {
    width: 100%; height: 100%; border-radius: 50%; padding: 7px; background: #0b1120;
  }
  .photo div {
    width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 50% 35%, #eef2ff 0%, #e0e7ff 45%, #cffafe 100%);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 15%; mix-blend-mode: multiply; }
</style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>
  <div class="wrap">
    <div class="text">
      <span class="logo">NB</span>
      <h1>Nidhi <span class="grad">Bhansali</span></h1>
      <p class="title">Senior React Native &amp; Node.js Developer</p>
      <p class="stack">React Native · TypeScript · Node.js · MongoDB</p>
      <div class="pills">
        <span class="pill"><span class="dot"></span>Open to full-time roles</span>
        <span class="pill">📍 Ahmedabad, India</span>
      </div>
    </div>
    <div class="photo-ring"><div class="photo"><div><img src="images/profile.png" alt=""></div></div></div>
  </div>
</body>
</html>
